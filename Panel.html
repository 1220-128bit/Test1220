<!DOCTYPE html>
<html lang="th">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎐 1220 PANEL</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Orbitron',sans-serif;
}

body{
background:#05000a;
color:#c77dff;
overflow:hidden;
}

/* 🌌 particles */
#particles-js{
position:fixed;
width:100%;
height:100%;
z-index:-1;
}

/* 💀 เลื่อน UI ลง */
.container{
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:flex-start;
padding-top:120px; /* 👈 เลื่อนลง */
}

/* 🟣 กล่อง */
.panel{
width:300px;
background:rgba(255,255,255,0.05);
border-radius:20px;
padding:20px;
backdrop-filter:blur(10px);
box-shadow:0 0 25px rgba(157,78,221,0.6);
text-align:center;
}

/* 🖼️ รูปด้านบน */
.logo{
width:80px;
height:80px;
border-radius:50%;
object-fit:cover;
margin-bottom:10px;
box-shadow:0 0 15px #c77dff;
}

/* 🔥 หัว */
.header{
font-size:18px;
margin-bottom:10px;
color:white;
}

/* 🔘 switch */
.switch{
display:flex;
justify-content:space-between;
align-items:center;
margin:12px 0;
color:white;
font-size:14px;
}

.switch input{
display:none;
}

.slider{
width:45px;
height:22px;
background:#444;
border-radius:20px;
position:relative;
cursor:pointer;
}

.slider::before{
content:"";
position:absolute;
width:18px;
height:18px;
background:white;
border-radius:50%;
top:2px;
left:2px;
transition:0.3s;
}

input:checked + .slider{
background:#c77dff;
box-shadow:0 0 12px #c77dff;
}

input:checked + .slider::before{
transform:translateX(22px);
}

/* ✨ ปุ่ม */
.reset{
margin-top:15px;
width:100%;
padding:10px;
border:none;
border-radius:12px;
background:#7b2cbf;
color:white;
box-shadow:0 0 15px #9d4edd;
cursor:pointer;
}
</style>
</head>

<body>

<div id="particles-js"></div>

<div class="container">
  <div class="panel">

    <!-- 🖼️ ใส่รูปตรงนี้ -->
    <img src="https://img1.pic.in.th/images/noFiltere1b25ba2729938c0.png" class="logo">

    <div class="header">🎐1220 PANEL</div>

    <div class="switch">🤤 จกเห็ด
      <label>
        <input type="checkbox">
        <div class="slider"></div>
      </label>
    </div>

    <div class="switch">🥵 ขี่โครย
      <label>
        <input type="checkbox">
        <div class="slider"></div>
      </label>
    </div>

    <div class="switch">👀 มองเห็ด
      <label>
        <input type="checkbox">
        <div class="slider"></div>
      </label>
    </div>

    <div class="switch">🍆 เก็บเห็ด
      <label>
        <input type="checkbox">
        <div class="slider"></div>
      </label>
    </div>

    <button class="reset" onclick="resetAll()">Close Ui</button>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/particles.js"></script>

<script>
particlesJS("particles-js",{
particles:{
number:{value:80},
color:{value:"#c77dff"},
shape:{type:"circle"},
opacity:{value:0.5},
size:{value:3},
line_linked:{
enable:true,
distance:150,
color:"#9d4edd",
opacity:0.4
},
move:{enable:true,speed:2}
},
interactivity:{
events:{
onhover:{enable:true,mode:"repulse"},
onclick:{enable:true,mode:"push"}
},
modes:{
repulse:{distance:120},
push:{particles_nb:4}
}
},
retina_detect:true
})

function resetAll(){
document.querySelectorAll("input").forEach(el=>el.checked=false);
}
</script>

</body>
</html>
